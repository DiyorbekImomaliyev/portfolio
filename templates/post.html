{% extends "base.html" %}

{% block title %}{{ post.title }} | Diyorbek Imomaliev{% endblock %}

{% block content %}
  <article class="article container">
    <a href="{{ url_for('blog') }}" class="muted small">← All posts</a>

    <h1>{{ post.title }}</h1>
    <p class="muted small">{{ post.created_at | nice_date }}</p>

    {% if is_admin %}
      <div class="buttons">
        <a href="{{ url_for('edit_post', post_id=post.id) }}" class="button">Edit post</a>
      </div>
    {% endif %}

    <div class="article-body">
      {{ post.content | markdown }}
    </div>
  </article>
{% endblock %}
