  <text x="400" y="268" text-anchor="middle" font-size="13" fill="#BCCAD7">aggregates updates</text>
  <g font-size="14" fill="#EAF0F5" text-anchor="middle">
    <rect x="110" y="90" width="180" height="90" rx="16" fill="#15223A" stroke="#26374F"/><text x="200" y="125" font-weight="600">Site A · edge device</text><text x="200" y="150" fill="#BCCAD7">energy data stays local</text>
    <rect x="110" y="320" width="180" height="90" rx="16" fill="#15223A" stroke="#26374F"/><text x="200" y="355" font-weight="600">Site B · edge device</text><text x="200" y="380" fill="#BCCAD7">energy data stays local</text>
    <rect x="510" y="90" width="180" height="90" rx="16" fill="#15223A" stroke="#26374F"/><text x="600" y="125" font-weight="600">Site C · edge device</text><text x="600" y="150" fill="#BCCAD7">energy data stays local</text>
    <rect x="510" y="320" width="180" height="90" rx="16" fill="#15223A" stroke="#26374F"/><text x="600" y="355" font-weight="600">Site D · edge device</text><text x="600" y="380" fill="#BCCAD7">energy data stays local</text>
